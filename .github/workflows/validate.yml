name: Validate all ten episode story packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: episode-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce complete 200-board structural art and screenplay validation
        run: python tools/check_series.py --strict-art
      - name: List live missing boards for safe Codex handoff
        run: python tools/list_missing_storyboards.py --limit 12
      - name: Independently audit existing images, family references, shot states and missing links
        run: python tools/audit_series.py --strict-art --report "$RUNNER_TEMP/series-audit.md" --manifest "$RUNNER_TEMP/shot-manifest.tsv"
      - name: Generate full non-image production handoff and continuity-review queue
        run: python tools/production_handoff.py --output-dir "$RUNNER_TEMP/production-handoff"
      - name: Export safe four-shot Google Flow pilot (text only)
        run: python tools/export_flow_shots.py --episode 1 --first 1 --last 4 --output-dir "$RUNNER_TEMP/flow-pilot"
      - name: Check living root documentation and repository navigation
        run: python tools/check_root_docs.py
      - name: Check Episode 01 sequential written handoff
        run: python Episode_01/sync.py --check
      - name: Run all source and audit regression tests
        run: python -m unittest discover -s tests -v
      - name: Upload non-image audit and 800-shot manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-audit-and-shot-manifest
          path: |
            ${{ runner.temp }}/series-audit.md
            ${{ runner.temp }}/shot-manifest.tsv
            ${{ runner.temp }}/production-handoff/
            ${{ runner.temp }}/flow-pilot/
          if-no-files-found: warn
          retention-days: 30
