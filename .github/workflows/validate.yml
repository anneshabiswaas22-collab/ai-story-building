name: Verify clean 20-minute story
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check story runtime, subtitles, storyboard versions and clean episode folders
        run: python Episode_01/check.py
