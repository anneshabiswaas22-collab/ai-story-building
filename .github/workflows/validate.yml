name: Validate preproduction source
on:
  push:
  pull_request:
jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Episode 1 timestamp structure
        run: python tools/validate_script.py
