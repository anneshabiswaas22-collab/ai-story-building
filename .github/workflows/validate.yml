name: Validate Maple House preproduction sources
on:
  push:
  pull_request:
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 20-minute story/recap timestamp structure
        run: python tools/validate_script.py
      - name: Check source data, subtitles, prices, lesson phases and source hashes
        run: python tools/validate_production.py
      - name: Check current storyboard coverage, provenance and image integrity
        run: python tools/validate_task4.py
      - name: Check that the current review page is reproducible
        run: python tools/build_task4_review.py --check
      - name: Reject stale handoff status and broken board-version references
        run: python tools/validate_handoff.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
