<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#f8f2e8"/><g fill="#284b45" font-family="Arial,sans-serif"><text x="70" y="68" font-size="42" font-weight="bold">Six owners, six complete pairs</text><text x="70" y="145" font-size="32">DAN — navy stripes</text><text x="70" y="219" font-size="32">MAYA — plum dots</text><text x="70" y="293" font-size="32">NINA — plain teal</text><text x="70" y="367" font-size="32">LEO — orange heels</text><text x="70" y="441" font-size="32">ELLA — coral stars</text><text x="70" y="515" font-size="32">MAX — green heels</text><text x="70" y="589" font-size="32">6 pairs = 12 socks</text></g></svg>
