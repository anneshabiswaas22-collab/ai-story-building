<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#f8f2e8"/><g fill="#284b45" font-family="Arial,sans-serif"><text x="70" y="68" font-size="42" font-weight="bold">Ask before packing</text><text x="70" y="145" font-size="32">Describe the pair</text><text x="70" y="219" font-size="32">Ask its owner</text><text x="70" y="293" font-size="32">Label the cube</text><text x="70" y="367" font-size="32">Store in the agreed place</text><text x="70" y="441" font-size="32">Leave personal belongings alone</text></g></svg>
