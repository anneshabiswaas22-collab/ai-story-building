<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img"><title>One cake, one team</title><rect width="1200" height="850" rx="24" fill="#f8f3e5"/><text x="65" y="95" font-family="sans-serif" font-size="42" fill="#253e3a">One cake, one team</text>
<text x="65" y="175" font-family="sans-serif" font-size="30" fill="#253e3a">1 cake = 6 equal slices</text>
<text x="65" y="239" font-family="sans-serif" font-size="30" fill="#253e3a">6 plates = 1 slice each</text>
<text x="65" y="303" font-family="sans-serif" font-size="30" fill="#253e3a">1 strawberry for Max</text>
<text x="65" y="367" font-family="sans-serif" font-size="30" fill="#253e3a">After serving: board empty; no extra cake</text>
<text x="65" y="431" font-family="sans-serif" font-size="30" fill="#253e3a">Adult handles knife; no candles or hot wax</text>
</svg>