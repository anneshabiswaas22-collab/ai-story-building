<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img"><title>A party for our team</title><rect width="1200" height="850" rx="24" fill="#f8f3e5"/><text x="65" y="95" font-family="sans-serif" font-size="42" fill="#253e3a">A party for our team</text>
<text x="65" y="175" font-family="sans-serif" font-size="30" fill="#253e3a">6 family members; 6 places</text>
<text x="65" y="239" font-family="sans-serif" font-size="30" fill="#253e3a">Decorations: one blue bow; one small cream banner</text>
<text x="65" y="303" font-family="sans-serif" font-size="30" fill="#253e3a">One prepaid cake order; verify actual delivery</text>
<text x="65" y="367" font-family="sans-serif" font-size="30" fill="#253e3a">Ask, compare, check, then celebrate</text>
<text x="65" y="431" font-family="sans-serif" font-size="30" fill="#253e3a">No candles or extra guests at dessert</text>
</svg>