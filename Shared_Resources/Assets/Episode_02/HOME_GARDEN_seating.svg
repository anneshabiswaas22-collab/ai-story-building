<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Home garden picnic positions</title><desc id="desc">Top-down planning diagram, not generated scene art. House door rear-left, tree rear-right. Ella far-left, Maya far-right, Leo left-end, Nina right-end, Dan near-left, Max near-right. Cooler beside Nina.</desc><rect x="0" y="0" width="1200" height="1000" fill="#e8f0dc" rx="0" /><text x="600" y="70" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#193c36" text-anchor="middle">HOME_GARDEN — FIXED PICNIC POSITIONS</text><rect x="80" y="100" width="250" height="75" fill="#d3c3a1" rx="12" /><text x="205" y="147" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#193c36" text-anchor="middle">House door</text><circle cx="1050" cy="145" r="65" fill="#80a873" /><text x="1050" y="152" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#193c36" text-anchor="middle">Tree</text><rect x="330" y="335" width="540" height="370" fill="#f7d59e" rx="24" /><text x="600" y="525" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#193c36" text-anchor="middle">Covered fruit salad</text><circle cx="370" cy="260" r="57" fill="#ffc3b1" stroke="#193c36" stroke-width="2" /><text x="370" y="269" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#193c36" text-anchor="middle">ELLA</text><circle cx="830" cy="260" r="57" fill="#d1b2cf" stroke="#193c36" stroke-width="2" /><text x="830" y="269" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#193c36" text-anchor="middle">MAYA</text><circle cx="190" cy="525" r="57" fill="#ffd09c" stroke="#193c36" stroke-width="2" /><text x="190" y="534" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#193c36" text-anchor="middle">LEO</text><circle cx="1010" cy="525" r="57" fill="#9ed1c9" stroke="#193c36" stroke-width="2" /><text x="1010" y="534" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#193c36" text-anchor="middle">NINA</text><circle cx="370" cy="805" r="57" fill="#b5dbf5" stroke="#193c36" stroke-width="2" /><text x="370" y="814" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#193c36" text-anchor="middle">DAN</text><circle cx="830" cy="805" r="57" fill="#b9db9b" stroke="#193c36" stroke-width="2" /><text x="830" y="814" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#193c36" text-anchor="middle">MAX</text><rect x="1040" y="650" width="125" height="85" fill="#b5dbf5" rx="10" /><text x="1102" y="703" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#193c36" text-anchor="middle">Cooler</text><text x="600" y="935" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#193c36" text-anchor="middle">Camera side / near edge — six family members, no chairs</text></svg>