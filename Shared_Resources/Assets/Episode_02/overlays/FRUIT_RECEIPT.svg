<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1550" viewBox="0 0 1000 1550" role="img" aria-labelledby="title desc"><title id="title">Fruit purchase receipt</title><desc id="desc">Nine fruit lines total $15.50. Paid $20.00; change $4.50. Tax included. Watermelon not purchased.</desc><rect x="0" y="0" width="1000" height="1550" fill="#fffdf5" rx="0" /><text x="500" y="95" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700" fill="#193c36" text-anchor="middle">FRUIT SHOP</text><text x="500" y="150" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="middle">PICNIC PURCHASE</text><text x="60" y="255" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">2 apples @ $1.00</text><text x="940" y="255" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$2.00</text><text x="60" y="341" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">1 bunch / 4 bananas</text><text x="940" y="341" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$2.00</text><text x="60" y="427" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">2 oranges @ $0.75</text><text x="940" y="427" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$1.50</text><text x="60" y="513" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">1 lemon</text><text x="940" y="513" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.50</text><text x="60" y="599" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">1 lime</text><text x="940" y="599" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.50</text><text x="60" y="685" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">Grapes / 1 lb</text><text x="940" y="685" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$3.00</text><text x="60" y="771" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">Strawberries / 1 lb</text><text x="940" y="771" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$3.00</text><text x="60" y="857" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">2 peaches @ $0.75</text><text x="940" y="857" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$1.50</text><text x="60" y="943" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">2 pears @ $0.75</text><text x="940" y="943" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$1.50</text><line x1="60" y1="1000" x2="940" y2="1000" stroke="#193c36" stroke-width="3" /><text x="60" y="1080" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#193c36" text-anchor="start">TOTAL</text><text x="940" y="1080" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#193c36" text-anchor="end">$15.50</text><text x="60" y="1165" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#193c36" text-anchor="start">PAID</text><text x="940" y="1165" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#193c36" text-anchor="end">$20.00</text><text x="60" y="1250" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" fill="#193c36" text-anchor="