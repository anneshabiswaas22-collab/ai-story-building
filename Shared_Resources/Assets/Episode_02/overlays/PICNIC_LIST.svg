<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc"><title id="title">One picnic list, two colors</title><desc id="desc">Blue half: nine fruit quantities with a sixteen-dollar budget. Yellow half: supplies brought from home.</desc><rect x="0" y="0" width="600" height="1400" fill="#b5dbf5" rx="0" /><rect x="600" y="0" width="600" height="1400" fill="#ffe59a" rx="0" /><text x="45" y="90" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700" fill="#193c36" text-anchor="start">ONE PICNIC LIST</text><text x="45" y="155" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="700" fill="#193c36" text-anchor="start">FRUIT</text><text x="45" y="210" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#193c36" text-anchor="start">Budget: $16.00</text><rect x="45" y="273" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="300" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">2 apples</text><rect x="45" y="373" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="400" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">1 bunch (4 bananas)</text><rect x="45" y="473" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="500" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">2 oranges</text><rect x="45" y="573" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="600" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">1 lemon</text><rect x="45" y="673" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="700" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">1 lime</text><rect x="45" y="773" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="800" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">1 lb grapes</text><rect x="45" y="873" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="900" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">1 lb strawberries</text><rect x="45" y="973" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="1000" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">2 peaches</text><rect x="45" y="1073" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="90" y="1100" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" fill="#193c36" text-anchor="start">2 pears</text><text x="45" y="1260" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#193c36" text-anchor="start">Compare taste, ripeness,</text><text x="45" y="1310" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#193c36" text-anchor="start">price, and basket space.</text><text x="645" y="155" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="700" fill="#193c36" text-anchor="start">FROM HOME</text><rect x="645" y="273" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="300" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">Blue-handled basket</text><rect x="645" y="373" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="400" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">Cooler + ice packs</text><rect x="645" y="473" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="500" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">Sealed drinking water</text><rect x="645" y="573" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="600" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">6 plates</text><rect x="645" y="673" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="700" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">6 forks</text><rect x="645" y="773" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="800" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">Napkins</text><rect x="645" y="873" width="25" height="25" fill="none" stroke="#193c36" stroke-width="3" /><text x="690" y="900" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#193c36" text-anchor="start">Picnic blanket</text><text x="645" y="1160" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#193c36" text-anchor="start">No extra shop cost.</text><text x="645" y="1260" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#193c36" text-anchor="start">Keep prepared fruit</text><text x="645" y="1310" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#193c36" text-anchor="start">covered and chilled.</text></svg>