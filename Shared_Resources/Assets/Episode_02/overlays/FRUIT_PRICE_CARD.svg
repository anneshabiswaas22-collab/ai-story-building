<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450" role="img" aria-labelledby="title desc"><title id="title">Fruit shop price card</title><desc id="desc">Fictional story prices include tax. Final fruit basket costs fifteen dollars and fifty cents. Optional watermelon costs eight dollars and is not bought.</desc><rect x="0" y="0" width="1100" height="1450" fill="#fff9eb" rx="0" /><rect x="0" y="0" width="1100" height="180" fill="#193c36" rx="0" /><text x="65" y="90" font-family="DejaVu Sans, sans-serif" font-size="53" font-weight="700" fill="white" text-anchor="start">FRUIT SHOP</text><text x="65" y="145" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="white" text-anchor="start">Prices include tax</text><text x="65" y="260" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Apples</text><text x="1035" y="260" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$1.00 each</text><text x="65" y="356" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Bananas</text><text x="1035" y="356" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$2.00 / 4-fruit bunch</text><text x="65" y="452" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Oranges</text><text x="1035" y="452" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.75 each</text><text x="65" y="548" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Lemon</text><text x="1035" y="548" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.50 each</text><text x="65" y="644" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Lime</text><text x="1035" y="644" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.50 each</text><text x="65" y="740" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Grapes</text><text x="1035" y="740" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$3.00 / lb</text><text x="65" y="836" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Strawberries</text><text x="1035" y="836" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$3.00 / lb</text><text x="65" y="932" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Peaches</text><text x="1035" y="932" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.75 each</text><text x="65" y="1028" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Pears</text><text x="1035" y="1028" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="end">$0.75 each</text><line x1="65" y1="1090" x2="1035" y2="1090" stroke="#193c36" stroke-width="3" /><text x="65" y="1160" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" fill="#193c36" text-anchor="start">Large watermelon</text><text x="1035" y="1160" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" fill="#193c36" text-anchor="end">$8.00 each</text><text x="65" y="1270" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">Compare before you choose.</text><text x="65" y="1330" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#193c36" text-anchor="start">Ask before taking a free sample.</text></svg>