<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Flour and flower labels</title><desc id="desc">The words sound the same in American English. Flour is a baking ingredient. A flower is a plant bloom and is not in this recipe.</desc><rect x="0" y="0" width="700" height="1000" fill="#b5dbf5" rx="0" /><rect x="700" y="0" width="700" height="1000" fill="#ffe59a" rx="0" /><text x="65" y="130" font-family="DejaVu Sans, sans-serif" font-size="89" font-weight="700" fill="#193c36" text-anchor="start">FLOUR</text><text x="765" y="130" font-family="DejaVu Sans, sans-serif" font-size="89" font-weight="700" fill="#193c36" text-anchor="start">FLOWER</text><text x="65" y="290" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">A baking ingredient.</text><text x="65" y="390" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">Used in pancakes.</text><text x="65" y="490" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">Read the recipe label.</text><text x="765" y="290" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">A plant bloom.</text><text x="765" y="390" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">Not in this recipe.</text><text x="765" y="490" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">The vase stays empty.</text><text x="700" y="740" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700" fill="#193c36" text-anchor="middle">They sound the same.</text><text x="700" y="830" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="middle">The recipe and labels tell us which one.</text><text x="700" y="915" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="middle">No flower touches the ingredients.</text></svg>