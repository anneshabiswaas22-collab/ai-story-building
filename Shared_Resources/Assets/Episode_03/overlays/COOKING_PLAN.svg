<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1500" viewBox="0 0 1300 1500" role="img" aria-labelledby="title desc"><title id="title">Pancake cooking plan</title><desc id="desc">Six batches of two small pancakes make twelve. Six family plates receive two each. Adults control the stove; switch it off at the end.</desc><rect x="0" y="0" width="1300" height="1500" fill="#fff9eb" rx="0" /><rect x="0" y="0" width="1300" height="190" fill="#193c36" rx="0" /><text x="65" y="85" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="start">ONE BATCH • TWELVE PANCAKES</text><text x="65" y="145" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="400" fill="white" text-anchor="start">6 cooking pairs → 6 plates, 2 on each</text><text x="75" y="280" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#193c36" text-anchor="start">Cooking pair 1</text><text x="550" y="280" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">2 pancakes</text><text x="1180" y="280" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#193c36" text-anchor="end">Total 2</text><text x="75" y="395" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#193c36" text-anchor="start">Cooking pair 2</text><text x="550" y="395" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">2 pancakes</text><text x="1180" y="395" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#193c36" text-anchor="end">Total 4</text><text x="75" y="510" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#193c36" text-anchor="start">Cooking pair 3</text><text x="550" y="510" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">2 pancakes</text><text x="1180" y="510" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#193c36" text-anchor="end">Total 6</text><text x="75" y="625" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#193c36" text-anchor="start">Cooking pair 4</text><text x="550" y="625" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">2 pancakes</text><text x="1180" y="625" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#193c36" text-anchor="end">Total 8</text><text x="75" y="740" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#193c36" text-anchor="start">Cooking pair 5</text><text x="550" y="740" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">2 pancakes</text><text x="1180" y="740" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#193c36" text-anchor="end">Total 10</text><text x="75" y="855" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#193c36" text-anchor="start">Cooking pair 6</text><text x="550" y="855" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#193c36" text-anchor="start">2 pancakes</text><text x="1180" y="855" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#193c36" text-anchor="end">Total 12</text><rect x="65" y="1000" width="1170" height="390" fill="#d8e7f3" rx="20" /><text x="100" y="1075" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">First crooked pancake is cooked and kept.</text><text x="100" y="1135" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Cook both sides and check the center.</text><text x="100" y="1195" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">No tasting raw flour, egg or batter.</text><text x="100" y="1255" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Adults handle pan and spatula; handle inward.</text><text x="100" y="1315" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">After pair 6: stove OFF, then serve.</text></svg>