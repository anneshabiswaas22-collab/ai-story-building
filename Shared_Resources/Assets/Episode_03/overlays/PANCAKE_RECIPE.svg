<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600" role="img" aria-labelledby="title desc"><title id="title">Family pancake recipe</title><desc id="desc">One batch: twelve small pancakes, two per person. Four tablespoons butter total: three in batter and one for pan greasing.</desc><rect x="0" y="0" width="1400" height="1600" fill="#fff9eb" rx="0" /><rect x="0" y="0" width="1400" height="210" fill="#193c36" rx="0" /><text x="70" y="95" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="700" fill="white" text-anchor="start">OUR PANCAKE RECIPE</text><text x="70" y="165" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="400" fill="white" text-anchor="start">12 small pancakes; 2 per person</text><text x="85" y="310" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">2 cups all-purpose flour</text><text x="85" y="422" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">2 tablespoons sugar</text><text x="85" y="534" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">1 tablespoon baking powder</text><text x="85" y="646" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">1/2 teaspoon salt</text><text x="85" y="758" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">2 large eggs</text><text x="85" y="870" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">1 1/2 cups milk</text><text x="85" y="982" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="400" fill="#193c36" text-anchor="start">4 tablespoons unsalted butter</text><text x="85" y="1080" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#193c36" text-anchor="start">Butter split: 3 tablespoons batter + 1 tablespoon pan</text><text x="85" y="1150" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#193c36" text-anchor="start">Baking powder: 1 tablespoon = 3 teaspoons</text><rect x="65" y="1210" width="1270" height="310" fill="#d8e7f3" rx="20" /><text x="95" y="1275" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="start">Measure dry ingredients into the BLUE bowl.</text><text x="95" y="1340" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="start">Whisk wet ingredients in YELLOW; combine in BLUE.</text><text x="95" y="1405" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="start">Fold gently. Rest 5 minutes. Adults cook both sides.</text><text x="95" y="1470" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="400" fill="#193c36" text-anchor="start">Cook 6 pairs. Serve 2 fully cooked pancakes each.</text></svg>