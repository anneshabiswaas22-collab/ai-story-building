<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="100%" height="100%" fill="#fbf4df"/><text x="70" y="105" font-family="sans-serif" font-size="44" fill="#234d42">WHICH BENCH?</text><text x="70" y="190" font-family="sans-serif" font-size="30" fill="#234d42">West: green bench beside the stone squirrel</text><text x="70" y="255" font-family="sans-serif" font-size="30" fill="#234d42">Center: round stone fountain</text><text x="70" y="320" font-family="sans-serif" font-size="30" fill="#234d42">East: green bench under the big oak</text><text x="70" y="385" font-family="sans-serif" font-size="30" fill="#234d42">Keep the north arrow at the top.</text></svg>
