<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540"><title>Six prepaid one-way tickets</title><rect x="8" y="8" width="1384" height="524" rx="24" fill="#fffaf0" stroke="#175c72" stroke-width="5"/><text x="55" y="90" font-family="sans-serif" font-size="44" font-weight="700" fill="#183b41">Six prepaid one-way tickets</text><text x="55" y="170" font-family="sans-serif" font-size="34" fill="#263e45">3 adult one-way tickets × $2 = $6</text><text x="55" y="234" font-family="sans-serif" font-size="34" fill="#263e45">3 child one-way tickets × $1 = $3</text><text x="55" y="298" font-family="sans-serif" font-size="34" fill="#263e45">Total prepaid: $9</text><text x="55" y="362" font-family="sans-serif" font-size="34" fill="#263e45">6 tickets validated once</text><text x="55" y="426" font-family="sans-serif" font-size="34" fill="#263e45">No second payment. Return travel arranged later.</text></svg>
